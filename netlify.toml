[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Caching. Only /_astro/* has content-hashed filenames, so only it is safe to mark
# immutable. /fonts, /images and /videos are stable, non-hashed URLs that a CMS edit
# can replace at the same path, so they get a moderate max-age (still cached well,
# but a replaced asset refreshes within a day/week rather than being pinned for a
# year). HTML stays at the default revalidate so edits appear on the next deploy.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Baseline security headers on every response. (A Content-Security-Policy is
# intentionally omitted here: the site and the /admin/ editor rely on inline
# scripts, so a CSP needs per-script hashes/nonces — tracked as a follow-up.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
