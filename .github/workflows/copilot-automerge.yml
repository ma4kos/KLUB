# Copilot review + auto-merge
#
# Policy (requested by the repo owner, Aug 2026): every non-draft pull request
# gets a GitHub Copilot code review requested automatically; once Copilot has
# reviewed the CURRENT head commit without requesting changes and every check
# is green, the pull request is merged automatically.
#
# WHY THIS IS A SCHEDULED SWEEP AND NOT A `pull_request_review` TRIGGER
# --------------------------------------------------------------------
# The first version of this workflow listened for `pull_request_review` and
# merged when the review author was Copilot. It never once fired. GitHub holds
# workflow runs whose TRIGGERING ACTOR is a bot in the `action_required` state,
# waiting for a human to press "Approve and run" in the Actions tab — so on
# every Copilot review the run was created and immediately parked, and the
# job's `if` was never even evaluated (see runs 33251617022 and 33252437250,
# both `action_required`, both triggered by Copilot). The runs that did execute
# were the ones triggered by a human review comment, and those correctly
# skipped because the review author was not Copilot. The policy was
# unreachable by construction, and every merge under it was in fact completed
# by hand.
#
# A `schedule` run is triggered by the repository itself, so it is never
# parked. It also lets the gate be checked properly rather than trusted from an
# event payload: the sweep requires Copilot's review to sit on the pull
# request's CURRENT head SHA. The event-driven version did not, so a review of
# an old commit could have merged code Copilot never saw.
#
# To pause the policy, disable or delete this workflow file.

name: Copilot review & auto-merge

on:
  pull_request:
    # `synchronize` (a push to an open PR) is here on purpose: the sweep below
    # only merges when Copilot has reviewed the current head, so without a
    # re-request every review-and-fix cycle would leave the PR permanently
    # un-mergeable by the policy. The cost is one Copilot review per push.
    types: [opened, reopened, ready_for_review, synchronize]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  request-copilot-review:
    # `cms/` is the branch prefix Decap CMS hard-codes for editorial-workflow
    # drafts. Excluding it here means a draft Izzy is still writing can never be
    # reviewed-and-merged behind her back — the precondition for ever turning
    # editorial_workflow on in public/admin/config.yml.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      !startsWith(github.event.pull_request.head.ref, 'cms/')
    runs-on: ubuntu-latest
    steps:
      - name: Request a Copilot review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]' \
            && echo "Copilot review requested" \
            || echo "::warning::Could not request a Copilot review (is Copilot code review enabled for this repo?)"

  auto-merge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      COPILOT: copilot-pull-request-reviewer[bot]
    steps:
      - name: Merge every pull request that has cleared the gate
        run: |
          set -uo pipefail

          # Candidates. The same-repo filter is a security boundary, not a
          # nicety: this job holds a contents:write token, so without it anyone
          # could open a pull request from a fork and have it merged to main
          # with no human involved.
          candidates=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
            --jq ".[]
                  | select(.draft == false)
                  | select(.head.repo.full_name == \"$REPO\")
                  | select(.head.ref | startswith(\"cms/\") | not)
                  | [.number, .head.sha] | @tsv")

          if [ -z "$candidates" ]; then
            echo "No open pull requests are eligible."
            exit 0
          fi

          # Read the candidate list on FD 3, not stdin. Every command in this
          # loop inherits the loop's stdin, so any one of them that reads it
          # would swallow the remaining candidates and silently leave later
          # pull requests unmerged. FD 3 makes that impossible.
          while IFS=$'\t' read -r pr sha <&3; do
            [ -n "$pr" ] || continue
            echo "::group::PR #$pr ($sha)"

            # Copilot must have reviewed THIS commit. Its code review submits
            # "COMMENTED" reviews far more often than "APPROVED", so per the
            # owner's policy anything except CHANGES_REQUESTED clears the gate.
            #
            # Two traps live in this one call, and both let a merge through.
            #
            # `--paginate` runs the jq program ONCE PER PAGE and concatenates
            # the output, so the reduction to a single review must happen in
            # the shell, not in jq. An earlier version ended the jq program
            # with `| last | .state`, which yields one line per page: with a
            # COMMENTED review on page 1 and a CHANGES_REQUESTED on page 2,
            # `state` became the two-line string "COMMENTED\nCHANGES_REQUESTED",
            # which is not equal to "CHANGES_REQUESTED" — so the branch below
            # fell through and merged a pull request Copilot had asked for
            # changes on. Reviews come back oldest-first within and across
            # pages, so emitting one state per matching review and taking the
            # last line is the latest one. (The `candidates` query above is
            # safe under the same flag because it emits one line per pull
            # request and concatenating the pages is exactly what is wanted.)
            #
            # And the read must fail CLOSED. `--paginate` emits the pages it
            # already fetched before erroring, so piping straight into
            # `tail -n 1` would take the last line of a PARTIAL list and
            # discard the non-zero status with it — a COMMENTED review on
            # page 1 clearing the gate while an unread page 2 held the
            # CHANGES_REQUESTED. Capturing first lets the status be checked.
            if ! reviews=$(gh api "repos/$REPO/pulls/$pr/reviews" --paginate \
              --jq ".[]
                    | select(.user.login == \"$COPILOT\" and .user.type == \"Bot\" and .commit_id == \"$sha\")
                    | .state"); then
              echo "Holding: could not read the reviews for #$pr."
              echo "::endgroup::"; continue
            fi
            state=$(printf '%s\n' "$reviews" | tail -n 1)

            if [ -z "$state" ]; then
              echo "Waiting: Copilot has not reviewed $sha yet."
              echo "::endgroup::"; continue
            fi
            if [ "$state" = "CHANGES_REQUESTED" ]; then
              echo "Holding: Copilot requested changes on $sha."
              echo "::endgroup::"; continue
            fi
            echo "Copilot review on $sha: $state"

            # `mergeable` is null while GitHub computes the merge commit and
            # false on a real conflict; both hold. `tostring` rather than
            # `// "null"`, because jq's alternative operator treats false as
            # empty and would report a genuine conflict as "still computing".
            mergeable=$(gh api "repos/$REPO/pulls/$pr" --jq '.mergeable | tostring')
            if [ "$mergeable" != "true" ]; then
              echo "Holding: mergeable=$mergeable (false = conflict, null = still being computed)."
              echo "::endgroup::"; continue
            fi

            # Checked here rather than trusted from mergeable_state, which
            # reports "clean" when no branch protection makes a check required.
            # gh exits non-zero on any failing or still-pending check.
            if ! gh pr checks "$pr" --repo "$REPO"; then
              echo "Holding: checks are failing or still running."
              echo "::endgroup::"; continue
            fi

            gh pr merge "$pr" --repo "$REPO" --merge \
              && echo "PR #$pr merged after Copilot review" \
              || echo "::warning::Merge failed for PR #$pr (protection rule, or it moved under us)"
            echo "::endgroup::"
          done 3<<< "$candidates"
