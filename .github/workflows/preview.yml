# PREVIEW DEPLOYS DISABLED (2026-08-17) — site intentionally taken offline
# while content is reworked. To re-publish: restore the `on: push` triggers
# from this file's git history and push, or run this workflow manually.
name: Deploy preview to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # GitHub Pages serves this repo under /KLUB/, so prefix the site's
      # root-absolute URLs. The Netlify production build stays untouched.
      - name: Rewrite absolute URLs for the /KLUB/ base path
        run: |
          find dist -name '*.html' -exec sed -i 's|href="/|href="/KLUB/|g; s|src="/|src="/KLUB/|g; s|srcset="/|srcset="/KLUB/|g; s|action="/|action="/KLUB/|g' {} +
          # Built CSS references root-absolute assets too (e.g. @font-face url(/fonts/...)).
          find dist -name '*.css' -exec sed -i -E "s|url\((['\"]?)/|url(\1/KLUB/|g" {} +

      - name: Publish to gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy preview: ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
