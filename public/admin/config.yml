              - { label: "Photo alt text", name: "imageAlt", widget: "string", required: false }
              - { label: "Wide photo?", name: "wide", widget: "boolean", required: false }
              - { label: "Video (if video)", name: "video", widget: "file", required: false }
              - { label: "Video poster", name: "poster", widget: "image", required: false, hint: "JPG, PNG or WebP — any size works, it's automatically cropped to fit its frame. About 1200px on the longest side is plenty." }
