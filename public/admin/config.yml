          - { label: "Notice text", name: "noticeText", widget: "text" }
          - { label: "Caption under every slot", name: "slotCaption", widget: "string", hint: "e.g. 50 min · max 6" }
          - label: "Schedule"
            name: "days"
            widget: "list"
            summary: "{{fields.day}}"
            fields:
              - { label: "Day(s)", name: "day", widget: "string" }
              - label: "Classes"
                name: "slots"
                widget: "list"
                summary: "{{fields.time}} — {{fields.name}}"
                fields:
                  - { label: "Time", name: "time", widget: "string" }
                  - { label: "Class", name: "name", widget: "string" }
          - label: "Bottom call-to-action"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
