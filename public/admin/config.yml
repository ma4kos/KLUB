        fields:
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Browser-tab title", name: "title", widget: "string" }
              - { label: "Search result description", name: "description", widget: "text" }
          - label: "Top of page"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
