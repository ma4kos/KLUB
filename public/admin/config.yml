              - { label: "Heading", name: "heading", widget: "string", hint: "*word* = italic accent" }
              - { label: "Intro", name: "lede", widget: "text" }
              - { label: "Photo", name: "image", widget: "image", hint: "Real studio photography only. JPG, PNG or WebP — cropped automatically to fit its frame." }
