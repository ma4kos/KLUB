# Decap CMS configuration — the editing panel at /admin/
#
# How editors log in (production): the site must be hosted on Netlify with
# Identity + Git Gateway enabled (Site settings → Identity → Enable, then
# Identity → Services → Git Gateway → Enable). Invite editors by email from
# the Identity tab. Full steps in README.md.
#
# Editing locally without any of that: run `npx decap-server` in the project
# folder alongside `npm run dev`, then open http://localhost:4321/admin/
#
# Text conventions inside fields:
#   *word* → serif italic accent. Only works on fields whose hint says so —
#            elsewhere the asterisks show as typed.
#   ~text~ → renders at half size (e.g. 50~′~ for the minutes mark). Same rule:
#            only on fields whose hint says so.
#   a line break inside a heading renders as a line break on the page

backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"
site_url: "https://klub.cy"

# The built-in preview pane has none of the site's own styling, so it shows a
# misleading stack of bare fields. Turned off — use the "View Live" link on each
# entry (preview_path below) to see the real page instead.
editor:
  preview: false

collections:
  - name: "settings"
    label: "Studio Settings"
    description: "Your contact details, social links and the announcement bar — these feed every page at once."
    files:
      - name: "studio"
        label: "Contact, Socials & Banner"
        file: "src/content/studio.json"
        description: "Booking link, WhatsApp number and banner. The booking link changes every Book button on the site."
        fields:
          - label: "Email"
            name: "email"
            widget: "string"
            pattern: ['^[^@\s]+@[^@\s]+\.[a-zA-Z]{2,}$', 'Enter a valid email address']
          - label: "WhatsApp number"
            name: "whatsappNumber"
            widget: "string"
            required: false
            hint: "Digits only, international format, no + (e.g. 35799123456). Once set, the chat button switches from Instagram to WhatsApp."
            pattern: ['^$|^[1-9][0-9]{7,14}$', 'Digits only, no + and no spaces, e.g. 35799123456']
          - { label: "Phone (as displayed)", name: "phoneDisplay", widget: "string", required: false, hint: "e.g. +357 99 123 456" }
          - label: "Online booking link"
            name: "bookingUrl"
            widget: "string"
            required: false
            hint: "Paste the Wix Bookings URL here when it exists — every Book button on the site will point to it automatically."
            pattern: ['^$|^https://.+', 'Must start with https:// — paste the whole address from your browser']
          - label: "bsport company ID"
            name: "bsportCompanyId"
            widget: "string"
            required: false
            hint: "The studio's bsport company number (currently 6604). Powers the live booking calendar on the Book page. Clear it to hide the calendar."
            pattern: ['^$|^[0-9]{1,10}$', 'Digits only, e.g. 6604, or leave empty']
          - label: "bsport widget ID"
            name: "bsportWidgetId"
            widget: "string"
            required: false
            hint: "The bsport widget number (currently 868966), from bsport's Backoffice → Marketing → Widget. Both IDs must be set for the calendar to show."
            pattern: ['^$|^[0-9]{1,12}$', 'Digits only, e.g. 868966, or leave empty']
          - { label: "Main booking button text", name: "ctaLabel", widget: "string", hint: "The main Book button, repeated on the homepage hero, price card, closing section and the phone bar. If you change the price in this text, change it in 'Compact booking button text' below as well, and check the homepage price cards and the Pricing page — those are separate." }
          - { label: "Compact booking button text", name: "ctaCompact", widget: "string", hint: "Short priced variant used in the slim header on narrower screens — e.g. 'Book · €20'." }
          - label: "Google Analytics 4 ID"
            name: "ga4Id"
            widget: "string"
            required: false
            hint: "Looks like G-XXXXXXXXXX. Leave empty = no tracking script loads at all. Before turning this on in production, add a cookie/consent notice (see docs/handover-for-alex.md)."
            pattern: ['^$|^G-[A-Z0-9]{4,12}$', 'Must look like G-ABC1234567, or leave empty']
          - label: "Microsoft Clarity ID"
            name: "clarityId"
            widget: "string"
            required: false
            hint: "The short project id from clarity.microsoft.com (free heatmaps + session recordings). Leave empty = nothing loads."
            pattern: ['^$|^[a-z0-9]{6,16}$', 'The short code from clarity.microsoft.com, or leave empty']
          - { label: "Street address", name: "streetAddress", widget: "string", required: false, hint: "Leave empty until announced." }
          - { label: "Area", name: "addressLocality", widget: "string" }
          - { label: "Address note", name: "addressNote", widget: "text", hint: "Shown wherever the address would appear, until the street address is filled in." }
          - label: "Instagram URL"
            name: "instagram"
            widget: "string"
            pattern: ['^$|^https://.+', 'Must start with https://']
          - { label: "Instagram handle", name: "instagramHandle", widget: "string" }
          - label: "Facebook URL"
            name: "facebook"
            widget: "string"
            pattern: ['^$|^https://.+', 'Must start with https://']
          - label: "TikTok URL"
            name: "tiktok"
            widget: "string"
            required: false
            pattern: ['^$|^https://.+', 'Must start with https://']
          - { label: "TikTok handle", name: "tiktokHandle", widget: "string", required: false }
          - { label: "Opening label", name: "openingLabel", widget: "string" }
          - label: "Opening hours"
            name: "openingHours"
            widget: "list"
            summary: "{{fields.days}} · {{fields.opens}}–{{fields.closes}}"
            hint: "Shown to Google as the studio's opening hours. Add one row per group of days."
            fields:
              - { label: "Day(s)", name: "days", widget: "string", hint: "Two-letter day codes separated by commas: Mo,Tu,We,Th,Fr" }
              - { label: "Opens", name: "opens", widget: "string", hint: "24-hour, e.g. 07:00" }
              - { label: "Closes", name: "closes", widget: "string", hint: "24-hour, e.g. 20:00" }
          - label: "Founding-member signup form"
            name: "foundingForm"
            widget: "object"
            hint: "These are the categories you'll see next to each signup in the Netlify dashboard."
            fields:
              - { label: "'What interests you most?' options", name: "interestOptions", widget: "list", field: { label: "Option", name: "option", widget: "string" } }
              - { label: "Submit button text", name: "submitLabel", widget: "string" }
          - label: "Announcement banner"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Show the banner", name: "enabled", widget: "boolean" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Link text", name: "linkText", widget: "string", required: false, hint: "Leave this and the link address empty for a notice with no clickable link." }
              - label: "Link URL"
                name: "linkUrl"
                widget: "string"
                required: false
                pattern: ['^$|^/.*/$|^https://.+', 'Either a site path starting and ending with a slash, e.g. /founding-member/, or a full https:// address']

  - name: "pages"
    label: "Pages"
    description: "The words, photos and headings on each page of the site."
    files:
      - name: "home"
        label: "Homepage"
        file: "src/content/home.json"
        description: "Everything on the front page, top to bottom — hero, numbers row, about, classes, pricing preview, gallery, location and founding circle."
        fields:
          - label: "Google & browser tab"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Browser-tab title", name: "title", widget: "string" }
              - { label: "Search result description", name: "description", widget: "text" }
          - { label: "Line above the headline", name: "heroEyebrow", widget: "string" }
          - { label: "Headline", name: "heroHeading", widget: "text", hint: "*word* = italic accent. Press Enter for a second line." }
          - { label: "Intro paragraph", name: "heroLede", widget: "text" }
          - { label: "Second hero button text", name: "heroSecondaryLabel", widget: "string" }
          - { label: "Reassurance line under Book buttons", name: "bookNote", widget: "string", hint: "Short trust line shown under the hero Book button and inside the featured price card." }
          - label: "Hero video"
            name: "heroVideo"
            widget: "file"
            hint: "Short muted mp4 loop — max 20000 kB. Use real studio footage (e.g. saved from Instagram)."
            media_library:
              config:
                max_file_size: 20000000
          - label: "Hero video poster (still shown while loading)"
            name: "heroPoster"
            widget: "image"
            hint: "JPG, PNG or WebP — max 5000 kB. Any size works, it's automatically cropped to fit its frame; about 1200px on the longest side is plenty. If you are uploading straight from an iPhone, set Settings → Camera → Formats → Most Compatible first. A .HEIC file will not display on the website."
            media_library:
              config:
                max_file_size: 5000000
          - { label: "Scrolling ribbon lines", name: "marquee", widget: "list", field: { label: "Line", name: "line", widget: "string", hint: "*word* = italic accent" } }
          - label: "Numbers row"
            name: "stats"
            widget: "list"
            allow_add: false
            allow_remove: false
            min: 4
            max: 4
            summary: "{{fields.big}}"
            fields:
              - { label: "Big number", name: "big", widget: "string", hint: "~text~ renders smaller — e.g. 50~′~ shows the minutes mark at half size. *word* = italic accent." }
              - { label: "Caption", name: "small", widget: "string" }
          - label: "About section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Small line above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string", hint: "*word* = italic accent" }
              - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "p", widget: "text" } }
              - { label: "Large quote in the middle of the section", name: "pullQuote", widget: "string" }
              - { label: "Button label", name: "buttonLabel", widget: "string" }
              - label: "Photo"
                name: "image"
                widget: "image"
                hint: "JPG, PNG or WebP — max 5000 kB. Any size works, it's automatically cropped to fit its frame; about 1200px on the longest side is plenty. If you are uploading straight from an iPhone, set Settings → Camera → Formats → Most Compatible first. A .HEIC file will not display on the website."
                media_library:
                  config:
                    max_file_size: 5000000
              - { label: "Describe this photo", name: "alt", widget: "string", hint: "Describe this photo in one sentence for blind visitors and for Google. IMPORTANT: if you change the photo above, rewrite this to match." }
          - label: "Classes section heading"
            name: "classesHead"
            widget: "object"
            fields:
              - { label: "Small line above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string", hint: "*word* = italic accent" }
              - { label: "Intro paragraph", name: "lede", widget: "string" }
              - { label: "Button text", name: "buttonLabel", widget: "string" }
          - label: "Your Instructors section"
            name: "izzy"
            widget: "object"
            fields:
              - { label: "Small line above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string", hint: "*word* = italic accent" }
              - { label: "Intro paragraph", name: "lede", widget: "text" }
              - { label: "Button label", name: "buttonLabel", widget: "string" }
              - label: "Photo"
                name: "image"
                widget: "image"
                hint: "JPG, PNG or WebP — max 5000 kB. Any size works, it's automatically cropped to fit its frame; about 1200px on the longest side is plenty. If you are uploading straight from an iPhone, set Settings → Camera → Formats → Most Compatible first. A .HEIC file will not display on the website."
                media_library:
                  config:
                    max_file_size: 5000000
              - { label: "Describe this photo", name: "alt", widget: "string", hint: "Describe this photo in one sentence for blind visitors and for Google. IMPORTANT: if you change the photo above, rewrite this to match." }
          - label: "Pricing preview"
            name: "pricingTeaser"
            widget: "object"
            fields:
              - { label: "Small line above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string", hint: "*word* = italic accent" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Price-list button text", name: "listLabel", widget: "string" }
              - { label: "Intro offer bullet points", name: "includes", widget: "list", field: { label: "Point", name: "point", widget: "string" } }
              - label: "Price cards"
                hint: "The FIRST card is featured large with the booking button inside it — keep the intro offer first. Keep these in step with the Pricing page."
                name: "cards"
                widget: "list"
                summary: "{{fields.eyebrow}} — {{fields.price}}"
                fields:
                  - { label: "Label", name: "eyebrow", widget: "string" }
                  - { label: "Price", name: "price", widget: "string" }
                  - { label: "Note", name: "note", widget: "string" }
          - label: "The KLUB Experience section (studio gallery)"
            name: "experience"
            widget: "object"
            fields:
              - { label: "Small line above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string", hint: "*word* = italic accent" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button label", name: "buttonLabel", widget: "string" }
              - label: "Gallery photos"
                name: "gallery"
                widget: "list"
                summary: "{{fields.image}}"
                fields:
                  - label: "Photo"
                    name: "image"
                    widget: "image"
                    hint: "Real studio photography only. JPG, PNG or WebP — max 5000 kB, cropped automatically to fit its frame. If you are uploading straight from an iPhone, set Settings → Camera → Formats → Most Compatible first. A .HEIC file will not display on the website."
                    media_library:
                      config:
                        max_file_size: 5000000
                  - { label: "Describe this photo", name: "alt", widget: "string", hint: "Describe this photo in one sentence for blind visitors and for Google. IMPORTANT: if you change the photo above, rewrite this to match." }
          - label: "Location section"
            name: "location"
            widget: "object"
            fields:
              - { label: "Small line above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string", hint: "*word* = italic accent" }
              - { label: "Directions button text", name: "directionsLabel", widget: "string" }
              - { label: "Message button text", name: "messageLabel", widget: "string" }
              - label: "Photo"
                name: "image"
                widget: "image"
                hint: "JPG, PNG or WebP — max 5000 kB. Any size works, it's automatically cropped to fit its frame; about 1200px on the longest side is plenty. If you are uploading straight from an iPhone, set Settings → Camera → Formats → Most Compatible first. A .HEIC file will not display on the website."
                media_library:
                  config:
                    max_file_size: 5000000
              - { label: "Describe this photo", name: "alt", widget: "string", hint: "Describe this photo in one sentence for blind visitors and for Google. IMPORTANT: if you change the photo above, rewrite this to match." }
          - label: "Founding circle section"
            name: "founding"
            widget: "object"
            fields:
              - { label: "Small line above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string", hint: "*word* = italic accent" }
              - { label: "Text", name: "text", widget: "text" }

      - name: "classes-index"
        label: "Classes Page"
        file: "src/content/pages/classes-index.json"
        preview_path: "classes"
        description: "The Classes listing page that shows all four class cards. The class descriptions themselves live under Classes."
        fields:
          - label: "Google & browser tab"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Browser-tab title", name: "title", widget: "string" }
              - { label: "Search result description", name: "description", widget: "text" }
          - label: "Top of page"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Small line above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text", hint: "Mentions the number of classes — update it if a class is added or removed." }
          - { label: "'Read more' button text on each card", name: "detailLabel", widget: "string" }
          - { label: "Book button text on each card", name: "bookLabel", widget: "string" }
          - { label: "Closing line under the cards", name: "closingText", widget: "text" }

      - name: "instructors"
        label: "Our Instructors"
        file: "src/content/pages/instructors.json"
        preview_path: "instructors"
        description: "The Instructors page — the team story, credentials and the follow-along film. The homepage teaser for it lives under Homepage."
        fields:
          - label: "Google & browser tab"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Browser-tab title", name: "title", widget: "string" }
              - { label: "Search result description", name: "description", widget: "text" }
          - label: "Top of page"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Small line above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string", hint: "*word* = italic accent" }
              - { label: "Intro paragraph", name: "lede", widget: "text" }
              - label: "Photo"
                name: "image"
                widget: "image"
                hint: "Real studio photography only. JPG, PNG or WebP — max 5000 kB, cropped automatically to fit its frame. If you are uploading straight from an iPhone, set Settings → Camera → Formats → Most Compatible first. A .HEIC file will not display on the website."
                media_library:
                  config:
                    max_file_size: 5000000
              - { label: "Describe this photo", name: "alt", widget: "string", hint: "Describe this photo in one sentence for blind visitors and for Google. IMPORTANT: if you change the photo above, rewrite this to match." }
          - label: "Numbers row"
            name: "stats"
            widget: "list"
            allow_add: false
            allow_remove: false
            min: 4
            max: 4
            summary: "{{fields.big}}"
            fields:
              - { label: "Big number", name: "big", widget: "string", hint: "~text~ renders smaller — e.g. 50~′~ shows the minutes mark at half size. *word* = italic accent." }
              - { label: "Caption", name: "small", widget: "string" }
          - { label: "Journey — small line above the heading", name: "journeyEyebrow", widget: "string" }
          - { label: "Journey — heading", name: "journeyHeading", widget: "string", hint: "*word* = italic accent" }
          - label: "Journey chapters"
            name: "journey"
            widget: "list"
            summary: "{{fields.place}} — {{fields.title}}"
            fields:
              - { label: "Place", name: "place", widget: "string" }
              - { label: "Years (e.g. 2018–2021)", name: "era", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Story", name: "body", widget: "text" }
              - { label: "Media type", name: "mediaType", widget: "select", options: ["image", "video"], hint: "A chapter can show a photo or a short muted video loop. Fill the matching fields below." }
              - label: "Photo"
                name: "image"
                widget: "image"
                hint: "JPG, PNG or WebP — max 5000 kB. Any size works, it's automatically cropped to fit its frame; about 1200px on the longest side is plenty. If you are uploading straight from an iPhone, set Settings → Camera → Formats → Most Compatible first. A .HEIC file will not display on the website."
                media_library:
                  config:
                    max_file_size: 5000000
              - { label: "Describe this photo", name: "imageAlt", widget: "string", hint: "Describe this photo in one sentence for blind visitors and for Google. IMPORTANT: if you change the photo above, rewrite this to match." }
              - { label: "Wide photo?", name: "wide", widget: "boolean", required: false }
              - label: "Video (if media type is video)"
                name: "video"
                widget: "file"
                required: false
                hint: "Short muted mp4 loop — max 20000 kB. Used only when Media type is video; the Photo above stays as the fallback."
                media_library:
                  config:
                    max_file_size: 20000000
              - label: "Video poster (if media type is video)"
                name: "poster"
                widget: "image"
                required: false
                hint: "The still shown while the video loads. JPG, PNG or WebP — max 5000 kB."
                media_library:
                  config:
                    max_file_size: 5000000
          - { label: "Credentials — small line above the heading", name: "qualsEyebrow", widget: "string" }
          - { label: "Credentials — heading", name: "qualsHeading", widget: "string", hint: "*word* = italic accent" }
          - label: "Credentials"
            name: "quals"
            widget: "list"
            summary: "{{fields.t}}"
            fields:
              - { label: "Qualification", name: "t", widget: "string" }
              - { label: "Detail", name: "s", widget: "string" }
          - { label: "Languages line", name: "langsLine", widget: "text" }
          - label: "Quote"
            name: "quote"
            widget: "object"
            fields:
              - { label: "Quote text", name: "text", widget: "text", hint: "*word* = italic accent" }
              - { label: "Attribution", name: "by", widget: "string" }
          - label: "Follow the journey section"
            name: "follow"
            widget: "object"
            fields:
              - { label: "Small line above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string", hint: "*word* = italic accent" }
              - { label: "Text", name: "text", widget: "text" }
              - label: "Video"
                name: "video"
                widget: "file"
                hint: "Short muted mp4 loop — max 20000 kB."
                media_library:
                  config:
                    max_file_size: 20000000
              - label: "Video poster"
                name: "poster"
                widget: "image"
                hint: "JPG, PNG or WebP — max 5000 kB. Any size works, it's automatically cropped to fit its frame; about 1200px on the longest side is plenty. If you are uploading straight from an iPhone, set Settings → Camera → Formats → Most Compatible first. A .HEIC file will not display on the website."
                media_library:
                  config:
                    max_file_size: 5000000
          - label: "Bottom call-to-action"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string", hint: "*word* = italic accent" }
              - { label: "Text", name: "text", widget: "string" }

      - name: "about"
        label: "About"
        file: "src/content/pages/about.json"
        preview_path: "about"
        description: "The About page — the studio story, the space and what KLUB believes."
        fields:
          - label: "Google & browser tab"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Browser-tab title", name: "title", widget: "string" }
              - { label: "Search result description", name: "description", widget: "text" }
          - label: "Top of page"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Small line above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
          - label: "The Space section"
            name: "space"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "p", widget: "text" } }
              - { label: "Large quote in the middle of the section", name: "pullQuote", widget: "string" }
              - { label: "Closing paragraph", name: "afterQuote", widget: "text" }
              - label: "Photos"
                name: "images"
                widget: "list"
                allow_add: false
                allow_remove: false
                min: 2
                max: 2
                fields:
                  - label: "Photo"
                    name: "image"
                    widget: "image"
                    hint: "JPG, PNG or WebP — max 5000 kB. Any size works, it's automatically cropped to fit its frame; about 1200px on the longest side is plenty. If you are uploading straight from an iPhone, set Settings → Camera → Formats → Most Compatible first. A .HEIC file will not display on the website."
                    media_library:
                      config:
                        max_file_size: 5000000
                  - { label: "Describe this photo", name: "alt", widget: "string", hint: "Describe this photo in one sentence for blind visitors and for Google. IMPORTANT: if you change the photo above, rewrite this to match." }
          - label: "What We Believe section"
            name: "beliefs"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }

      - name: "timetable"
        label: "Timetable"
        file: "src/content/pages/timetable.json"
        preview_path: "timetable"
        description: "The planned weekly schedule. Class names here are plain text — they do not have to match the Classes section exactly."
        fields:
