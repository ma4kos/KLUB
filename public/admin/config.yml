# Decap CMS configuration — the editing panel at /admin/
#
# How editors log in (production): the site must be hosted on Netlify with
# Identity + Git Gateway enabled (Site settings → Identity → Enable, then
# Identity → Services → Git Gateway → Enable). Invite editors by email from
# the Identity tab. Full steps in README.md.
#
# Editing locally without any of that: run `npx decap-server` in the project
# folder alongside `npm run dev`, then open http://localhost:4321/admin/
#
# Text conventions inside fields:
#   *word*  → renders in the serif italic accent color (e.g. "Meet *Izzy*")
#   a line break inside a heading renders as a line break on the page

backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"
site_url: "https://klub.cy"

collections:
  - name: "settings"
    label: "Studio Settings"
    files:
      - name: "studio"
        label: "Contact, Socials & Banner"
        file: "src/content/studio.json"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "WhatsApp number", name: "whatsappNumber", widget: "string", required: false, hint: "Digits only, international format, no + (e.g. 35799123456). Once set, the chat button switches from Instagram to WhatsApp." }
          - { label: "Phone (as displayed)", name: "phoneDisplay", widget: "string", required: false, hint: "e.g. +357 99 123 456" }
          - { label: "Online booking link", name: "bookingUrl", widget: "string", required: false, hint: "Paste the Wix Bookings URL here when it exists — every Book button on the site will point to it automatically." }
          - { label: "Main booking button text", name: "ctaLabel", widget: "string", hint: "The one primary button repeated across the site (hero, mobile bar, closing section) — e.g. 'Book Your First Class — €20'. Change the price here once and it updates everywhere." }
          - { label: "Compact booking button text", name: "ctaCompact", widget: "string", hint: "Short priced variant used in the slim header on narrower screens — e.g. 'Book · €20'." }
          - { label: "Google Analytics 4 ID", name: "ga4Id", widget: "string", required: false, hint: "Looks like G-XXXXXXXXXX. Leave empty = no tracking script loads at all. Before turning this on in production, add a cookie/consent notice (see docs/handover-for-alex.md)." }
          - { label: "Microsoft Clarity ID", name: "clarityId", widget: "string", required: false, hint: "The short project id from clarity.microsoft.com (free heatmaps + session recordings). Leave empty = nothing loads." }
          - { label: "Street address", name: "streetAddress", widget: "string", required: false, hint: "Leave empty until announced." }
          - { label: "Area", name: "addressLocality", widget: "string" }
          - { label: "Address note", name: "addressNote", widget: "string", hint: "Shown wherever the address would appear, until the street address is filled in." }
          - { label: "Instagram URL", name: "instagram", widget: "string" }
          - { label: "Instagram handle", name: "instagramHandle", widget: "string" }
          - { label: "Facebook URL", name: "facebook", widget: "string" }
          - { label: "TikTok URL", name: "tiktok", widget: "string", required: false }
          - { label: "TikTok handle", name: "tiktokHandle", widget: "string", required: false }
          - { label: "Opening label", name: "openingLabel", widget: "string" }
          - label: "Announcement banner"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Show the banner", name: "enabled", widget: "boolean" }
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Link text", name: "linkText", widget: "string" }
              - { label: "Link URL", name: "linkUrl", widget: "string" }

  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Homepage"
        file: "src/content/home.json"
        fields:
          - { label: "Line above the headline", name: "heroEyebrow", widget: "string" }
          - { label: "Headline", name: "heroHeading", widget: "text", hint: "*word* = italic accent. Press Enter for a second line." }
          - { label: "Intro paragraph", name: "heroLede", widget: "text" }
          - { label: "Second hero button text", name: "heroSecondaryLabel", widget: "string" }
          - { label: "Reassurance line under Book buttons", name: "bookNote", widget: "string", hint: "Short trust line shown under the hero Book button and inside the featured price card." }
          - { label: "Hero video", name: "heroVideo", widget: "file", hint: "Short muted mp4 loop — use real studio footage (e.g. saved from Instagram)." }
          - { label: "Hero video poster (still shown while loading)", name: "heroPoster", widget: "image", hint: "JPG, PNG or WebP — any size works, it's automatically cropped to fit its frame. About 1200px on the longest side is plenty; larger is fine, it's just a bigger file." }
          - { label: "Scrolling ribbon lines", name: "marquee", widget: "list", field: { label: "Line", name: "line", widget: "string" } }
          - label: "Numbers row"
            name: "stats"
            widget: "list"
            allow_add: false
            summary: "{{fields.big}}"
            fields:
              - { label: "Big number", name: "big", widget: "string" }
              - { label: "Caption", name: "small", widget: "string" }
          - label: "About section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "p", widget: "text" } }
              - { label: "Pull quote", name: "pullQuote", widget: "string" }
              - { label: "Button label", name: "buttonLabel", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", hint: "JPG, PNG or WebP — any size works, it's automatically cropped to fit its frame. About 1200px on the longest side is plenty; larger is fine, it's just a bigger file." }
              - { label: "Photo alt text", name: "alt", widget: "string" }
          - label: "Classes section heading"
            name: "classesHead"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "lede", widget: "string" }
              - { label: "Button text", name: "buttonLabel", widget: "string" }
          - label: "Your Instructors section"
            name: "izzy"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "lede", widget: "text" }
              - { label: "Button label", name: "buttonLabel", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", hint: "JPG, PNG or WebP — any size works, it's automatically cropped to fit its frame. About 1200px on the longest side is plenty; larger is fine, it's just a bigger file." }
              - { label: "Photo alt text", name: "alt", widget: "string" }
          - label: "Pricing preview"
            name: "pricingTeaser"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Price-list button text", name: "listLabel", widget: "string" }
              - { label: "Intro offer bullet points", name: "includes", widget: "list", field: { label: "Point", name: "point", widget: "string" } }
              - label: "Price cards"
                hint: "The FIRST card is featured large with the booking button inside it — keep the intro offer first."
                name: "cards"
                widget: "list"
                summary: "{{fields.eyebrow}} — {{fields.price}}"
                fields:
                  - { label: "Label", name: "eyebrow", widget: "string" }
                  - { label: "Price", name: "price", widget: "string" }
                  - { label: "Note", name: "note", widget: "string" }
          - label: "The KLUB Experience section (studio gallery)"
            name: "experience"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string", hint: "*word* = italic accent" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button label", name: "buttonLabel", widget: "string" }
              - label: "Gallery photos"
