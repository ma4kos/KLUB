  - name: "pricing"
    label: "Pricing"
    description: "Every price on the site's Pricing page, plus the pricing questions underneath it."
    files:
      - name: "pricing"
        label: "Price Tables & Pricing FAQ"
        file: "src/content/pricing.json"
        preview_path: "pricing"
        description: "The four price tables. These prices also go to Google as the studio's published price list, and the homepage price cards and FAQ answers should be kept in step by hand."
        fields:
          - label: "Google & browser tab"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Browser-tab title", name: "title", widget: "string" }
              - { label: "Search result description", name: "description", widget: "text" }
          - label: "Top of page"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Small line above the heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
          - label: "Price tables"
            name: "tables"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Table title", name: "title", widget: "string" }
              - { label: "Short description", name: "blurb", widget: "string" }
              - label: "Last two column headings"
                name: "cols"
                widget: "list"
                allow_add: false
                allow_remove: false
                min: 2
                max: 2
                field: { label: "Heading", name: "heading", widget: "string" }
                hint: "Two headings only — they sit after the fixed Package and Price columns."
              - label: "Rows"
                name: "rows"
                widget: "list"
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { label: "Package name", name: "name", widget: "string" }
                  - label: "Price"
                    name: "price"
                    widget: "string"
                    pattern: ['^\s*€\s*[0-9]+([.,][0-9]{2})?\s*$', 'A plain euro amount like €32 or €12.50 — digits only, no words']
                    hint: "This exact figure is also sent to Google as the price of this package, so it must be a bare amount."
                  - { label: "Per class/session", name: "per", widget: "string" }
                  - { label: "Note", name: "note", widget: "string" }
          - { label: "Terms line (shown under the tables)", name: "termsText", widget: "text", hint: "The words 'read our full policies.' are added automatically at the end, as a link. Finish this line with a dash or a colon, NOT a full stop." }
          - label: "Pricing questions"
            name: "faqs"
            widget: "list"
            summary: "{{fields.q}}"
            fields:
              - { label: "Question", name: "q", widget: "string" }
              - { label: "Answer", name: "a", widget: "text" }

  - name: "classes"
    label: "Classes"
    description: "The four class descriptions, one page each. The Classes listing page that links to them is under Pages."
    files:
      - name: "classes"
        label: "Class Descriptions"
        file: "src/content/classes.json"
        preview_path: "classes"
        description: "One entry per class page. Classes cannot be added or removed here — the timetable and the Book page link to these by name."
        fields:
          - label: "Classes"
            name: "classes"
            widget: "list"
            allow_add: false
            allow_remove: false
            min: 4
            max: 4
            summary: "{{fields.name}}"
            fields:
              - label: "Slug (do not change — it is the page address)"
                name: "slug"
                widget: "string"
                pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Lowercase letters, numbers and hyphens only — and please do not change this at all']
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Level", name: "level", widget: "string" }
              - { label: "Duration", name: "duration", widget: "string" }
              - { label: "Capacity", name: "capacity", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "One-line description (cards)", name: "short", widget: "text" }
              - label: "Photo"
                name: "image"
                widget: "image"
                hint: "JPG, PNG or WebP — max 5000 kB. Any size works, it's automatically cropped to fit its frame; about 1200px on the longest side is plenty. If you are uploading straight from an iPhone, set Settings → Camera → Formats → Most Compatible first. A .HEIC file will not display on the website."
                media_library:
                  config:
                    max_file_size: 5000000
              - { label: "Describe this photo", name: "imageAlt", widget: "string", hint: "Describe this photo in one sentence for blind visitors and for Google. IMPORTANT: if you change the photo above, rewrite this to match." }
              - { label: "Browser-tab title (SEO)", name: "seoTitle", widget: "string" }
              - { label: "Search result description (SEO)", name: "seoDescription", widget: "text" }
              - { label: "Intro paragraphs", name: "intro", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
              - { label: "What to expect", name: "expect", widget: "list", field: { label: "Point", name: "point", widget: "string" } }
              - { label: "Who it's for", name: "goodFor", widget: "list", field: { label: "Point", name: "point", widget: "string" } }

